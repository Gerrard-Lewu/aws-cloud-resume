name: Deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Check out the production site
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const claims = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString("utf8")
            );

            core.info(JSON.stringify({
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              repository_owner: claims.repository_owner,
              ref: claims.ref
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload static website files to S3
        run: >-
          aws s3 sync . "s3://${{ vars.S3_BUCKET }}"
          --delete
          --exclude ".git/*"
          --exclude ".github/*"
          --exclude "README.md"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
